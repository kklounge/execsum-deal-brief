name: Daily Exec Sum Deal Brief

on:
  schedule:
    # 05:00 UTC = 13:00 Asia/Hong_Kong (UTC+8, no daylight saving time).
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: execsum-daily-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install .

      - name: Generate and send brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          REPORT_TIMEZONE: Asia/Hong_Kong
        run: python -m execsum_deal_brief.main

